services:
  smartscraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartscraper
    restart: unless-stopped
    ports:
      - "${UI_BIND_ADDRESS:-127.0.0.1}:${UI_PORT:-8080}:8080"
    environment:
      - UI_BIND_ADDRESS=0.0.0.0
      - UI_PORT=8080
      - DOWNLOAD_DIR=/app/downloads
      - DATA_DIR=/app/data
      - OLLAMA_BASE_URL=http://agent_ollama:11434
      - PLANNER_MODEL=${PLANNER_MODEL:-qwen3:14b}
      - CLASSIFIER_BACKEND=${CLASSIFIER_BACKEND:-decision}
      - CLASSIFIER_MODEL=${CLASSIFIER_MODEL:-tev1:4b}
      - QWEN_ONLY_MODEL=${QWEN_ONLY_MODEL:-qwen3:14b}
      - MODEL_RESIDENCY=${MODEL_RESIDENCY:-sequential}
      - PLANNER_CONTEXT_TOKENS=${PLANNER_CONTEXT_TOKENS:-4096}
      - PLANNER_MAX_OUTPUT_TOKENS=${PLANNER_MAX_OUTPUT_TOKENS:-1024}
      - PLANNER_THINKING=${PLANNER_THINKING:-false}
      - CLASSIFIER_INPUT_BUDGET_TOKENS=${CLASSIFIER_INPUT_BUDGET_TOKENS:-1400}
      - CLASSIFIER_KEEP_ALIVE=${CLASSIFIER_KEEP_ALIVE:-10m}
      - MAX_DESCRIPTION_WINDOWS=${MAX_DESCRIPTION_WINDOWS:-4}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-180}
      - MODEL_HANDOFF_TIMEOUT_SECONDS=${MODEL_HANDOFF_TIMEOUT_SECONDS:-60}
      - MAX_INFERENCE_CONCURRENCY=1
      - HTTP_TIMEOUT_SECONDS=${HTTP_TIMEOUT_SECONDS:-30}
      - REQUEST_INTERVAL_SECONDS=${REQUEST_INTERVAL_SECONDS:-2}
      - REQUEST_JITTER_SECONDS=${REQUEST_JITTER_SECONDS:-1}
      - PER_ORIGIN_CONCURRENCY=${PER_ORIGIN_CONCURRENCY:-1}
      - GLOBAL_HTTP_CONCURRENCY=${GLOBAL_HTTP_CONCURRENCY:-2}
      - MAX_HTTP_RETRIES=${MAX_HTTP_RETRIES:-3}
      - BACKOFF_INITIAL_SECONDS=${BACKOFF_INITIAL_SECONDS:-15}
      - BACKOFF_MAX_SECONDS=${BACKOFF_MAX_SECONDS:-300}
      - MAX_PAGES=${MAX_PAGES:-500}
      - MAX_FILE_MB=${MAX_FILE_MB:-100}
      - MAX_DETAIL_DEPTH=${MAX_DETAIL_DEPTH:-1}
      - ENABLE_BROWSER_RENDERING=${ENABLE_BROWSER_RENDERING:-false}
    volumes:
      - "${HOST_DOWNLOAD_DIR:-./downloads}:/app/downloads"
      - "${HOST_DATA_DIR:-./data}:/app/data"
    networks:
      - shared_ai_net

networks:
  shared_ai_net:
    external: true
